<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="#2563eb">

    <title>VKU Field Survey</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>

    <header class="header">
        <h1>VKU Field Survey</h1>
        <p>Điều tra nhu cầu việc làm của sinh viên</p>
    </header>
<div id="networkStatus" class="network-status">
    🟢 Online
</div>
    <main class="container">

        <section class="card">

            <h2>Tạo phiên khảo sát</h2>

           
<form id="surveyForm">

    <!-- Người phỏng vấn -->
    <div class="form-group">
        <label for="interviewer">
            Người phỏng vấn
        </label>

        <input
            type="text"
            id="interviewer"
            placeholder="Nhập tên người phỏng vấn"
            required
        >
    </div>

    <!-- Thời gian -->
    <div class="form-group">
        <label for="surveyTime">
            Thời gian
        </label>

        <input
            type="text"
            id="surveyTime"
            readonly
        >
    </div>

    <!-- Vị trí -->
    <div class="form-group">

        <label>
            Vị trí hiện tại
        </label>

        <button
            type="button"
            id="locationBtn"
        >
            📍 Lấy vị trí
        </button>

        <p id="locationStatus">
            Chưa lấy vị trí
        </p>

    </div>

    <!-- Chuyên ngành -->
    <div class="form-group">

        <label for="major">
            Chuyên ngành
        </label>

        <input
            type="text"
            id="major"
            placeholder="Ví dụ: Công nghệ thông tin"
            required
        >

    </div>

    <!-- Nhu cầu việc làm -->
    <div class="form-group">

        <label for="jobDemand">
            Nhu cầu việc làm
        </label>

        <textarea
            id="jobDemand"
            rows="4"
            placeholder="Nhập nhu cầu việc làm của sinh viên..."
            required
        ></textarea>

    </div>
<!-- Loại công việc -->
<div class="form-group">

    <label for="jobType">
        Loại công việc
    </label>

    <select
        id="jobType"
        required
    >

        <option value="">
            -- Chọn loại công việc --
        </option>

        <option value="Internship">
            Thực tập
        </option>

        <option value="Full-time">
            Full-time
        </option>

        <option value="Part-time">
            Part-time
        </option>

        <option value="Freelance">
            Freelance
        </option>

        <option value="Khác">
            Khác
        </option>

    </select>

</div>
    <!-- Mức lương mong muốn -->
    <div class="form-group">

        <label for="expectedSalary">
            Mức lương mong muốn
        </label>

        <select
            id="expectedSalary"
            required
        >

            <option value="">
                -- Chọn mức lương --
            </option>

            <option value="Dưới 5 triệu">
                Dưới 5 triệu
            </option>

            <option value="5-7 triệu">
                5–7 triệu
            </option>

            <option value="7-10 triệu">
                7–10 triệu
            </option>

            <option value="10-15 triệu">
                10–15 triệu
            </option>

            <option value="15-20 triệu">
                15–20 triệu
            </option>

            <option value="Trên 20 triệu">
                Trên 20 triệu
            </option>

            <option value="Thỏa thuận">
                Thỏa thuận
            </option>

        </select>

    </div>

    <!-- Kinh nghiệm làm việc -->
    <div class="form-group">

        <label for="experience">
            Kinh nghiệm làm việc
        </label>

        <select
            id="experience"
            required
        >

            <option value="">
                -- Chọn kinh nghiệm --
            </option>

            <option value="Chưa có kinh nghiệm">
                Chưa có kinh nghiệm
            </option>

            <option value="Dưới 1 năm">
                Dưới 1 năm
            </option>

            <option value="1-2 năm">
                1–2 năm
            </option>

            <option value="2-3 năm">
                2–3 năm
            </option>

            <option value="Trên 3 năm">
                Trên 3 năm
            </option>

        </select>

    </div>

    <!-- Thời gian có thể bắt đầu -->
    <div class="form-group">

        <label for="availableTime">
            Thời gian có thể bắt đầu làm việc
        </label>

        <select
            id="availableTime"
            required
        >

            <option value="">
                -- Chọn thời gian --
            </option>

            <option value="Ngay lập tức">
                Ngay lập tức
            </option>

            <option value="Trong 1 tháng">
                Trong 1 tháng
            </option>

            <option value="1-3 tháng">
                1–3 tháng
            </option>

            <option value="Trên 3 tháng">
                Trên 3 tháng
            </option>

            <option value="Chưa xác định">
                Chưa xác định
            </option>

        </select>

    </div>

    <!-- Ảnh -->
    <div class="form-group">

        <label for="image">
            Ảnh hiện trường
        </label>

        <input
            type="file"
            id="image"
            accept="image/*"
            capture="environment"
        >

    </div>

    <!-- Nút lưu -->
    <button
        type="submit"
        class="save-btn"
    >
        💾 Lưu phiên khảo sát
    </button>

</form>



        </section>

        <!-- Danh sách phiên -->
        <section class="card">

            <h2>Lịch sử khảo sát</h2>

            <div id="surveyList">

                <p>
                    Chưa có phiên khảo sát nào.
                </p>

            </div>

        </section>

    </main>

    <script src="js/db.js"></script>
<script src="js/app.js"></script>
<script>
    if ("serviceWorker" in navigator) {

        window.addEventListener("load", () => {

            navigator.serviceWorker
                .register("./sw.js")
                .then((registration) => {

                    console.log(
                        "Service Worker registered:",
                        registration.scope
                    );

                })
                .catch((error) => {

                    console.error(
                        "Service Worker registration failed:",
                        error
                    );

                });

        });

    }
</script>
</body>
</html>
